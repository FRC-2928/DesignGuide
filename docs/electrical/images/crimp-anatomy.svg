<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
  <title>Parts of a good open-barrel crimp: contact area, brush, conductor crimp, bell mouth, inspection window, insulation crimp</title>
  <rect x="0" y="0" width="760" height="300" rx="12" fill="#f7f7f5"/>

  <!-- wire insulation -->
  <rect x="470" y="128" width="270" height="34" rx="6" fill="#f2c200" stroke="#9a7c00" stroke-width="1.5"/>
  <!-- bare strands from insulation end forward -->
  <rect x="300" y="136" width="175" height="18" fill="#c8793b"/>
  <line x1="300" y1="140" x2="470" y2="140" stroke="#a65d26" stroke-width="1"/>
  <line x1="300" y1="145" x2="470" y2="145" stroke="#a65d26" stroke-width="1"/>
  <line x1="300" y1="150" x2="470" y2="150" stroke="#a65d26" stroke-width="1"/>

  <!-- terminal floor joining contact area, conductor crimp and insulation crimp (one piece of metal) -->
  <rect x="270" y="156" width="215" height="8" fill="#b8b8b8" stroke="#666" stroke-width="1"/>
  <!-- contact area (front of terminal) -->
  <rect x="40" y="122" width="210" height="46" rx="4" fill="#c9a43a" stroke="#806418" stroke-width="1.5"/>
  <rect x="250" y="134" width="30" height="22" fill="#c9a43a" stroke="#806418" stroke-width="1.5"/>
  <!-- conductor crimp barrel -->
  <path d="M310 126 L390 126 L398 118 L398 172 L390 164 L310 164 Z" fill="#b8b8b8" stroke="#666" stroke-width="1.5"/>
  <!-- insulation crimp -->
  <rect x="480" y="116" width="62" height="58" rx="6" fill="#b8b8b8" stroke="#666" stroke-width="1.5"/>

  <!-- labels -->
  <g font-size="14" fill="#222">
    <line x1="140" y1="120" x2="140" y2="78" stroke="#444"/>
    <text x="140" y="70" text-anchor="middle" font-weight="bold">Contact area</text>
    <text x="140" y="52" text-anchor="middle">no strands here, not bent</text>

    <line x1="295" y1="158" x2="270" y2="210" stroke="#444"/>
    <text x="270" y="228" text-anchor="middle" font-weight="bold">Brush</text>
    <text x="270" y="246" text-anchor="middle">strand tips flush or</text>
    <text x="270" y="262" text-anchor="middle">up to 1 mm past barrel</text>

    <line x1="350" y1="124" x2="350" y2="78" stroke="#444"/>
    <text x="350" y="70" text-anchor="middle" font-weight="bold">Conductor crimp</text>
    <text x="350" y="52" text-anchor="middle">bare copper only</text>

    <line x1="396" y1="172" x2="420" y2="210" stroke="#444"/>
    <text x="430" y="228" text-anchor="middle" font-weight="bold">Bell mouth</text>
    <text x="430" y="246" text-anchor="middle">small flare at the back</text>

    <line x1="440" y1="134" x2="520" y2="78" stroke="#444"/>
    <text x="520" y="70" text-anchor="middle" font-weight="bold">Inspection window</text>
    <text x="520" y="52" text-anchor="middle">see copper AND insulation</text>

    <line x1="540" y1="176" x2="600" y2="210" stroke="#444"/>
    <text x="620" y="228" text-anchor="middle" font-weight="bold">Insulation crimp</text>
    <text x="620" y="246" text-anchor="middle">grips insulation,</text>
    <text x="620" y="262" text-anchor="middle">doesn't cut it</text>
  </g>
</svg>
